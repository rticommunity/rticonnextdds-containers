services:
  ui-tools:
    image: ${IMAGE_TAG_PREFIX:-local}/connext-ui-tools:${CONNEXT_VERSION:-7.7.0}
    platform: linux/amd64
    network_mode: host
    shm_size: 1gb
    environment:
      UI_PASSWORD_FILE: /run/secrets/ui_password
    secrets:
      - ui_password
    volumes:
      - type: bind
        source: ${RTI_LICENSE_FILE_HOST:?Set an absolute license file path}
        target: /opt/rti.com/rti_connext_dds-${CONNEXT_VERSION:-7.7.0}/rti_license.dat
        read_only: true
        bind:
          create_host_path: false
      - ui-home:/home/user
secrets:
  ui_password:
    file: ${UI_PASSWORD_FILE_HOST:?Set an absolute password file path}
volumes:
  ui-home:
